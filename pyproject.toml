[project]
name = "agent-for-everyone"
version = "0.1.0"
description = "AI Kanban work assistant for non-tech users"
authors = [
    { name = "Dat Nguyen", email = "dat@example.com" }
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "langchain-openai",
    "langchain-core",
    "httpx",
    "loguru",
    "baml-py",
    "python-dotenv",
]
readme = "README.md"
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]
