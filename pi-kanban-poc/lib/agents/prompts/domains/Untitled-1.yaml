    2. Lịch Thuế (Tax Calendar Tool)

    Design an interactive tax calendar tool page for Vietnamese small
    businesses. The page is part of "Kế Toán Phở" website.

    Step 1 - Selection:      
    - User picks their business type from visual cards with icons:
      "Hộ kinh doanh" (sole proprietorship), "Công ty TNHH" (LLC), 
      "Doanh nghiệp tư nhân" (private enterprise), "Công ty Cổ phần" 
      (joint stock company)
    - User picks tax declaration method: "Khấu trừ" or "Trực tiếp" 

    Step 2 - Results:    
    - A horizontal visual timeline showing months Jan-Dec 2026     
    - Tax deadlines appear as colored dots/markers on the timeline   
    - Each deadline is clickable, showing a popup card with:     
      - Deadline name in Vietnamese 
      - Due date with countdown "Còn X ngày"     
      - Penalty info "Phạt chậm nộp: ..."    
      - Source link
    - Color coding: red (urgent <7 days), orange (upcoming <30 days),
      green (future)     
    - Buttons: "Tải PDF" (Download PDF), "Nhận nhắc qua email"     
      (Get email reminders)     
      
    Style: Warm colors matching Kế Toán Phở brand. Friendly, not
    intimidating. Icons and illustrations over raw data.    
    Vietnamese text throughout.      
  
    ---    


    3. Máy Tính Thuế (Tax Calculator)

    Design a tax calculator page for Vietnamese micro businesses,    
    part of "Kế Toán Phở" website.

    Two calculator tabs:     
    Tab 1 - "Thuế TNDN" (Corporate Income Tax):
    - Input fields: Tổng doanh thu (Total revenue), Tổng chi phí   
      (Total expenses), with Vietnamese dong currency format
    - Slider or input for revenue amount     
    - Result card showing: 
      - Thu nhập chịu thuế (Taxable income)      
      - Thuế suất áp dụng (Applied tax rate: 20%)     
      - Số thuế phải nộp (Tax payable)
      - A friendly explanation: "Nếu quán phở Chú Tư có doanh thu    
500 triệu/năm..."

    Tab 2 - "Thuế GTGT" (VAT):  
    - Input: Doanh thu, VAT đầu vào (Input VAT), VAT đầu ra (Output VAT)
    - Toggle between "Phương pháp khấu trừ" and "Phương pháp trực tiếp"
    - Side-by-side comparison showing which method saves more   
    - Result with visual bar chart comparing both methods      
  
    Bottom section:     
    - "Lưu ý" disclaimer box    
    - Link to source regulations
    - "Chia sẻ kết quả" (Share results) button
   
    Style: Calculator feel but warm and friendly. Use the Kế Toán Phở  
    amber/green palette. Large, readable numbers. Mobile-friendly inputs.
    All Vietnamese.


    4. So Sánh Phương Pháp (Method Comparison)

    Design a comparison tool page that helps Vietnamese small business
    owners choose between "Thuế khoán" (lump-sum tax) vs "Kê khai"
    (declaration-based tax). Part of "Kế Toán Phở" website.

    Input section:
    - Doanh thu dự kiến/năm (Expected annual revenue) - slider + input      
    - Ngành nghề (Industry) - dropdown with common vSME industries:  
      Ăn uống, Bán lẻ, Dịch vụ, Công nghệ, etc.
    - Số nhân viên (Number of employees) - counter      

    Output section:      
    - Side-by-side comparison cards:
      Left card: "Thuế Khoán" with estimated tax amount, pros, cons  
      Right card: "Kê Khai" with estimated tax amount, pros, cons
    - A highlighted recommendation banner: "Với quán phở doanh thu 
      300 triệu/năm, phương pháp XXX giúp bạn tiết kiệm YYY đồng"    
    - Visual comparison chart (bar or donut) 
    - Checklist of requirements for each method
    
    Include a character illustration of "Chú Tư" pointing at the
    recommended option with a speech bubble.
    
    Style: Decision-making focused, clear visual hierarchy,    
    Kế Toán Phở warm brand colors. Vietnamese text.
      

    5. Checklist Tuân Thủ (Compliance Checklist)

    Design an interactive compliance checklist page for new Vietnamese    
    small businesses. Part of "Kế Toán Phở" website.    

    Top section:
    - Business type selector (same as tax calendar)     
    - Progress bar: "Bạn đã hoàn thành 4/12 bước" with percentage    
     
    Checklist section:     
    - Grouped by category with collapsible sections:      
     
      "📋 Đăng ký kinh doanh" (Business Registration)   
      - [ ] Đăng ký giấy phép kinh doanh
      - [ ] Đăng ký mã số thuế    
      - [ ] Mở tài khoản ngân hàng doanh nghiệp

      "🧾 Hóa đơn & Chứng từ" (Invoices & Documents)  
      - [ ] Đăng ký hóa đơn điện tử 
      - [ ] Mua chữ ký số    
     
      "📊 Kê khai & Nộp thuế" (Declaration & Payment)   
      - [ ] Đăng ký kê khai thuế điện tử    
      - [ ] Nộp tờ khai thuế ban đầu
  
    Each checklist item when expanded shows:
    - Brief explanation in simple Vietnamese
    - Link to relevant government portal  
    - Estimated time to complete 
    - "Xem hướng dẫn chi tiết" link
  
    Bottom: Confetti animation when 100% complete!   
   
    Style: Gamified, encouraging. Green checkmarks, progress  
    celebration. Kế Toán Phở brand. Vietnamese throughout.      
   
