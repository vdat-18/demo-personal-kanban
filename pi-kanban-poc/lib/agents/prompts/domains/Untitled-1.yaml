    1. Landing Page

    Design a Vietnamese tax and accounting website landing page called      
    "Kế Toán Phở" (ketoanpho.vn).     

    Brand concept: "Thuế & Kế toán, dễ như ăn phở" - making tax simple      
    for micro/small businesses in Vietnam.

    Color palette: Warm, phở-inspired colors (warm amber/brown tones,
    rice noodle cream whites, fresh herb greens, chili red accents). 

    The landing page should include:
    - A hero section with the tagline "Thuế & Kế toán, dễ như ăn phở"
      and a friendly illustration of a phở bowl with accounting elements  
    - A section showcasing 4 tools: Lịch Thuế (Tax Calendar),      
      Máy Tính Thuế (Tax Calculator), So Sánh Phương Pháp (Method Comparison),
      Checklist Tuân Thủ (Compliance Checklist) - each as a card with icon
    - A "Tin Thuế 2026" (Tax News) preview section showing 3 latest articles
    - A "Kế Toán Vỉa Hè" teaser section with a character mascot "Chú Tư"
      (a friendly phở shop owner) and "Coming Soon" badge
    - Newsletter signup CTA: "Nhận nhắc hạn nộp thuế qua email"
    - Footer with disclaimer: "Nội dung mang tính tham khảo"

    Style: Modern, clean, friendly, not corporate. Think Duolingo meets
    Vietnamese street food aesthetic. Mobile-first responsive design.
    All text in Vietnamese.
