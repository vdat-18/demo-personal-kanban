    8. Mobile Navigation & Global Components   

    Design the global navigation and mobile experience for
    "Kế Toán Phở" (ketoanpho.vn) - a Vietnamese tax/accounting website.     

    Desktop header:      
    - Logo: Phở bowl icon + "Kế Toán Phở" text 
    - Navigation: Trang chủ | Công cụ (dropdown: Lịch Thuế, Máy Tính Thuế,    
      So Sánh, Checklist) | Tin Thuế | Kế Toán Vỉa Hè |
    - CTA button: "Nhận nhắc thuế" (Get tax reminders)  

    Mobile:   
    - Sticky bottom navigation bar with 5 icons:
      🏠 Trang chủ | 🧮 Công cụ | 📰 Tin thuế | 📖 Học | 📧 Đăng ký
    - Hamburger menu for full navigation   
    - Floating action button for quick access to tax calculator  
      
    Footer: 
    - 4 columns: Công cụ, Nội dung, Về chúng tôi, Liên hệ
    - Disclaimer: "Kế Toán Phở cung cấp thông tin tham khảo..."   
    - Social links: Facebook, TikTok, Zalo 
    - "Được xây dựng với 🍜 tại Việt Nam"    
      
    Style: Consistent warm Kế Toán Phở branding. Mobile-first. 
    Clean, modern but friendly. All Vietnamese.
