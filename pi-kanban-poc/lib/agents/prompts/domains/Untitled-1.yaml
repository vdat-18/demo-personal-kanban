     6. Blog / Tin Thuế (Tax News)   
     
    Design a blog listing page and article template for "Tin Thuế 2026"     
    section of Kế Toán Phở website.   
     
    Blog listing page:     
    - Filter chips at top: "Tất cả", "Thuế TNDN", "Thuế GTGT",
      "Hóa đơn điện tử", "Thuế TNCN", "Mới nhất"      
    - Article cards in a grid (2 columns desktop, 1 mobile):
      - Category tag colored chip     
      - Title in Vietnamese
      - TL;DR excerpt (2 lines)     
      - "Cập nhật: dd/mm/yyyy"
      - Reading time estimate     

    Single article template: 
    - Breadcrumb: Trang chủ > Tin Thuế > [Article title]
    - Article header with category tag and date
    - "TL;DR" highlighted box at top (key takeaway in 1-2 sentences) 
    - "🍜 Giải thích kiểu Phở" section with warm background color
      and Chú Tư illustration
    - "📋 Ảnh hưởng đến bạn" section with tabs for different    
      business types   
    - "🔗 Nguồn tham khảo" section with links to official documents    
    - Disclaimer footer 
    - Share buttons: Facebook, Zalo, Copy link      
    - "Bài viết liên quan" (Related articles) at bottom
    
    Style: Clean, readable, generous whitespace. Warm brand colors      
    for highlight sections. Vietnamese throughout. 
     

      7. Kế Toán Vỉa Hè (Coming Soon Teaser)     

